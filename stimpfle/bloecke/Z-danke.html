<style>
.stf-karte{transition:transform .25s ease,box-shadow .25s ease}
.stf-karte:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(20,23,31,.16)}
.stf-foto{overflow:hidden}
.stf-foto img{transition:transform .5s ease}
.stf-foto:hover img{transform:scale(1.04)}
.stf-zeile{transition:background-color .2s ease}
.stf-zeile:hover{background:#f7f8fd}
.stf-mosaik{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.stf-mosaik .stf-gross{grid-column:1 / -1;aspect-ratio:3/2}
.stf-mosaik .stf-klein{aspect-ratio:1/1}
@media (min-width:640px){
 .stf-mosaik{grid-template-columns:repeat(4,1fr)}
 .stf-mosaik .stf-gross{grid-column:1 / 3;grid-row:1 / 3;aspect-ratio:auto}
}
.stf-team{display:grid;grid-template-columns:1fr;gap:32px;align-items:center}
@media (min-width:720px){.stf-team{grid-template-columns:5fr 6fr}}
.stf-kachel{display:grid;grid-template-columns:44px 1fr 84px;column-gap:12px;row-gap:4px;align-items:start}
@media (min-width:640px){.stf-kachel{grid-template-columns:48px 1fr 96px;column-gap:16px;row-gap:6px}}
.stf-kachel .stf-ic{grid-row:1 / 3}
.stf-kachel .stf-mini{grid-row:1 / 3;grid-column:3;align-self:center}
.stf-vz{display:grid;grid-template-columns:1fr}
.stf-vz .stf-neu{border-top:1px solid #e3e6ef}
.stf-vkopf{display:none}
.stf-trenn{border-top:8px solid #eef1fb}
.stf-lbl2{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.stf-lbl{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
@media (min-width:640px){.stf-vz{grid-template-columns:1fr 1fr}.stf-vz .stf-neu{border-top:0;border-left:1px solid #e3e6ef}.stf-vkopf{display:grid}.stf-trenn{border-top:1px solid #dfe3ef}}
</style>
