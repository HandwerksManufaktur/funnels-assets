<style>
.fx *{box-sizing:border-box}
.fx{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
.fx h1,.fx h2,.fx h3,.fx p{margin:0}
.fx-kick{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.fx-h2{font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;line-height:1.12}
.fx .fx-lead{font-size:17px;line-height:1.5;margin-top:14px}
.fx h1,.fx h2,.fx h3{text-wrap:balance}
.fx-in{max-width:760px;margin:0 auto}
.fx-head{max-width:640px;margin:0 auto 32px;text-align:center}
.fx-photo{display:block;width:100%;height:auto;border-radius:16px}
.fx-card{background:#F5F5F5;border-radius:16px}
.fx-chip{display:inline-block;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:#F5F5F5;color:#525252}
.fx-hello{display:grid;gap:28px;align-items:center}
.fx-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fx-way{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fx-way .fx-w{background:#fff;border:1px solid #E5E5E5;border-radius:16px;overflow:hidden}
.fx-way .fx-w img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.fx-way .fx-w div{padding:14px 14px 16px}
.fx-way .fx-w.fx-first{border:2px solid #0076BE}
.fx-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fx-vorteile{display:grid;grid-template-columns:1fr;gap:16px}
.fx-bekannt{display:grid;gap:24px;align-items:center}
.fx-pair{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;overflow:hidden;border:1px solid #D4D4D4}
.fx-step{display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
.fx-tl{position:relative;display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.fx-tl-t{flex-shrink:0;width:60px;height:60px;border-radius:50%;background:#0076BE;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 0 0 6px #fff}
.fx-tl-c{flex:1;min-width:0;background:#F5F5F5;border-radius:16px;overflow:hidden}
.fx-tl-c img{display:block;width:100%;aspect-ratio:5/2;object-fit:cover}
.fx-hphoto{max-width:340px;aspect-ratio:4/3;object-fit:cover;object-position:center 16%}
.fx-seit{max-width:620px;margin:0 auto 24px;border-radius:20px;aspect-ratio:3/2;object-fit:cover}
@media(min-width:640px){
 .fx-hphoto{aspect-ratio:1/1;object-position:center 12%}
 .fx-seit{aspect-ratio:4/3}
 .fx-tl-c{display:grid;grid-template-columns:44% 1fr;align-items:stretch}
 .fx-tl-c img{aspect-ratio:auto;height:100%;min-height:170px}
 .fx-tl-c>div{align-self:center}
 .fx-hello{grid-template-columns:1fr 1fr;gap:40px}
 .fx-way{grid-template-columns:repeat(4,1fr)}
 .fx-tiles{grid-template-columns:repeat(4,1fr)}
 .fx-vorteile{grid-template-columns:1fr 1fr}
 .fx-bekannt{grid-template-columns:1fr 1fr;gap:32px}
 .fx-tl{gap:22px}.fx-tl-t{width:66px;height:66px}
}
</style>
<div class="fx" style="background:#1A1A1A;padding:60px 20px 12px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;box-shadow:0 0 0 100vmax #1A1A1A;clip-path:inset(0 -100vmax -2px -100vmax);color:#fff;">
<div style="max-width:640px;margin:0 auto;text-align:center;">
    <img src="https://cdn.jsdelivr.net/gh/HandwerksManufaktur/funnels-assets@889626284481aefe34e03800ab5d51f6cdef3774/fischer-chemnitz/shooting-bettina.jpg" alt="Bettina Tittmann, Geschäftsführung" style="width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center 22%;border:4px solid #0076BE;display:inline-block;">
    <div style="font-size:15px;font-weight:700;color:#fff;margin:12px 0 28px;">Bettina Tittmann <span style="color:#A3A3A3;font-weight:500;">· Geschäftsführung</span></div>
    <h2 class="fx-h2" style="color:#fff;font-size:clamp(30px,6vw,44px);margin-bottom:16px;">Finden wir heraus, <span style="color:#6FC0F0;">was dein Bad wirklich braucht.</span></h2>
    <p style="font-size:16px;color:#D4D4D4;line-height:1.55;margin:0 auto 10px;max-width:520px;">Ein paar kurze Fragen. Danach meldet sich Bettina werktags innerhalb von 24 Stunden persönlich bei dir.</p>
    <p style="font-size:14px;color:#A3A3A3;">Unverbindlich. Und kein Callcenter.</p>
  </div>
</div>
